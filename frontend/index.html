<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRAG Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2310a37f' d='M12 2 2 7l10 5 10-5-10-5Zm-7 8.5L2 12l10 5 10-5-2.5-1.5L12 16.5 5 10.5ZM5 15 2 16.5 12 21l10-4.5L19 15l-7 3.5L5 15Z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div id="app">

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M12 2 2 7l10 5 10-5-10-5Zm-7 8.5L2 12l10 5 10-5-2.5-1.5L12 16.5 5 10.5ZM5 15 2 16.5 12 21l10-4.5L19 15l-7 3.5L5 15Z"/>
          </svg>
          <span class="logo-name">CRAG</span>
        </div>
        <button id="sidebar-close" class="icon-btn" title="Close sidebar" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M5 11h11.2l-4.6-4.6L13 5l7 7-7 7-1.4-1.4 4.6-4.6H5v-2Z"/></svg>
        </button>
      </div>

      <button id="new-chat-btn" class="new-chat-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
        New Chat
      </button>

      <div class="sidebar-sections">
        <section id="pinned-section" class="conv-section hidden">
          <div class="section-label">Pinned</div>
          <div id="pinned-list" class="conv-list"></div>
        </section>
        <section id="recent-section" class="conv-section hidden">
          <div class="section-label">Recent</div>
          <div id="recent-list" class="conv-list"></div>
        </section>
        <section id="documents-section" class="conv-section">
          <div class="section-label">Documents</div>
          <div id="documents-list" class="conv-list"></div>
          <button id="upload-btn" class="upload-btn">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
            Upload PDF
          </button>
        </section>
      </div>
    </aside>
    <div id="sidebar-backdrop"></div>

    <!-- Main -->
    <main id="main">
      <header class="topbar">
        <button id="sidebar-open" class="icon-btn" title="Open sidebar" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"/></svg>
        </button>
        <div class="chat-header">
          <div class="header-titles">
            <span id="chat-title" class="chat-title">CRAG Assistant</span>
            <span id="chat-subtitle" class="chat-subtitle hidden"></span>
          </div>
          <span id="status-dot" class="status-dot offline" title="API status"></span>
        </div>
        <div class="menu-wrap">
          <button id="menu-btn" class="icon-btn" title="Menu" aria-label="Menu">&#8943;</button>
          <div id="menu-popup" class="menu-popup hidden">
            <button data-act="evaluate">Evaluate last answer</button>
            <button data-act="clear">Clear chat</button>
            <button data-act="settings">Settings</button>
          </div>
        </div>
      </header>

      <section id="chat-view" class="chat-view">
        <div id="messages" class="messages"><div class="messages-inner"></div></div>
        <div id="chat-composer" class="composer-wrap"></div>
      </section>
    </main>
  </div>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title">Settings</span>
        <button class="icon-btn modal-close" data-close="true" aria-label="Close">&#10005;</button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="setting-api-key">API Key</label>
        <input id="setting-api-key" type="password" class="text-input" placeholder="rag-secret-2026" />
        <label class="field-label" for="setting-topk">Top K (retrieval depth)</label>
        <input id="setting-topk" type="number" class="text-input" min="1" max="10" value="3" />
        <div class="status-row" id="setting-status"></div>
        <button id="save-settings" class="primary-btn">Save Settings</button>
        <button id="clear-cache" class="ghost-btn">Clear Backend Cache</button>
      </div>
    </div>
  </div>

  <!-- Evaluation modal -->
  <div id="eval-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title">Evaluation</span>
        <button class="icon-btn modal-close" data-eval-close="true" aria-label="Close">&#10005;</button>
      </div>
      <div class="modal-body">
        <div id="eval-loading" class="eval-loading hidden">Running evaluation...</div>
        <div id="eval-question" class="eval-question hidden"></div>
        <div id="eval-metrics" class="eval-metrics"></div>
      </div>
    </div>
  </div>

  <div id="toast-wrap" class="toast-wrap"></div>

  <!-- Hidden file input for PDF attach -->
  <input id="file-input" type="file" accept=".pdf" hidden />

  <script src="/assets/app.js"></script>
</body>
</html>
